name: The Sleepless Shelf Scheduler

on:
  # GitHub画面から手動実行できる
  workflow_dispatch:

  # GitHub Actions の cron は UTC
  # 08:00 UTC = 17:00 JST
  # 毎月25日の17:00ごろに実行
  schedule:
    - cron: "0 8 25 * *"

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Actions画面から手動実行した場合
      # 日付に関係なく、有効なリマインダーを1件テスト送信
      - name: Test Send
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_STAFF: ${{ secrets.DISCORD_WEBHOOK_STAFF }}
          DISCORD_WEBHOOK_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_PUBLIC }}
        run: |
          python scheduler/send_reminder.py --test

      # 毎月25日の自動実行
      - name: Scheduled Send
        if: github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK_STAFF: ${{ secrets.DISCORD_WEBHOOK_STAFF }}
          DISCORD_WEBHOOK_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_PUBLIC }}
        run: |
          python scheduler/send_reminder.py
